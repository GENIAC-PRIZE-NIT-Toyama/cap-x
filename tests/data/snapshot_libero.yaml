# Snapshot の E2E テスト用（tests/test_snapshot_e2e.py）。知覚・IK のサーバに頼らない API で動かす。
env:
  _target_: capx.envs.tasks.base.CodeExecutionEnvBase
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.libero.FrankaLiberoEnv
      suite_name: libero_object
      task_id: 0
    privileged: true
    apis:
      - SnapshotTestJointApi
    prompt: "Goal: {libero_environment_goal}"
