# Usage: uv run capx/envs/launch.py --config-path env_configs/human_oracle_code/robosuite/franka_robosuite_cube_lifting_oracle.yaml

env:
  _target_: capx.envs.tasks.franka.franka_lift.FrankaLiftCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_cube_lift_low_level  
    privileged: false
    apis:
      - FrankaControlApi
    # prompt is inherited from FrankaLiftCodeEnv class default


api_servers:
  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    
  - _target_: capx.serving.launch_contact_graspnet_server.main
    
  - _target_: capx.serving.launch_pyroki_server.main
    robot: panda_description
    target_link: panda_hand

record_video: true
output_dir: ./outputs/franka_robosuite_cube_lifting_oracle

trials: 100
num_workers: 7
use_oracle_code: true
