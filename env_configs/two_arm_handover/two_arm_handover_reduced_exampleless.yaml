# Usage: uv run capx/envs/launch.py --config-path env_configs/two_arm_handover/two_arm_handover_reduced_exampleless.yaml

env:
  _target_: capx.envs.tasks.franka.two_arm_handover.TwoArmHandoverCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: two_arm_handover_robosuite 
    apis:
      - FrankaControlApiReducedExamplelessBimanualHandover
    # prompt is inherited from TwoArmHandoverCodeEnv class default

api_servers:
  - _target_: capx.serving.launch_sam3_server.main
    device: cuda

  - _target_: capx.serving.launch_contact_graspnet_server.main

  - _target_: capx.serving.launch_pyroki_server.main
    robot: panda_description
    target_link: panda_hand

record_video: true
output_dir: ./outputs/two_arm_handover_reduced_exampleless

trials: 100
num_workers: 5
use_oracle_code: false  


