# quick.yaml と同じタスクを、Low-Level Primitives の API で回すスイート（10 タスク）。
#
#   uv run --env-file .env suite.py suites/quick-low.yaml --agent agents/my_agent.py
#
# タスクの並びは quick.yaml と揃える（`<タスク名>_low` にしただけ）。quick.yaml を
# 変えたら、こちらも同じように変える。
#
# Low-Level では get_object_pose / goto_pose のような高水準の関数が無く、
# get_observation / segment_sam3_text_prompt / plan_grasp / solve_ik / move_to_joints
# などを組み合わせる。
#
# 書けるキーは quick.yaml を参照。
name: quick-low
trials: 1
max_steps: 20
tasks:
  # robosuite（3 / 6）: 持ち上げる（易）・積む（中）・差し込む（難）
  - cube_lifting_low
  - cube_stack_low
  - nut_assembly_low
  # LIBERO-90（5 / 90）
  - libero_90_6_low   # KITCHEN_SCENE1 下の引き出しを開ける（関節物体）
  - libero_90_21_low  # KITCHEN_SCENE3 コンロをつけてフライパンを載せる（複合）
  - libero_90_46_low  # LIVING_ROOM_SCENE1 アルファベットスープをかごに入れる（pick & place）
  - libero_90_70_low  # LIVING_ROOM_SCENE6 プリンを皿の右に置く（位置関係）
  - libero_90_74_low  # STUDY_SCENE1 本をキャディの左の仕切りに入れる
  # LIBERO-10（2 / 10）
  - libero_10_3_low   # KITCHEN_SCENE4 ボウルを下の引き出しに入れて閉める
  - libero_10_4_low   # LIVING_ROOM_SCENE5 2 つのマグをそれぞれの皿に置く
