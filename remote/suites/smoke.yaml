# 動作確認用の小さなスイート。robosuite 2 つと LIBERO 2 つを 1 回ずつ回す。
#
#   uv run --env-file .env suite.py suites/smoke.yaml --agent agents/my_agent.py
#
# 書けるキー:
#   name       保存先のフォルダ名（suite_<name>）。省略するとファイル名
#   trials     各タスクの試行回数。省略すると 1
#   seed       初期配置の seed。書くと全試行で固定、省略すると試行ごとにランダム
#   max_steps  1 試行で env.step() を呼べる回数。1〜10。省略すると 10
#   tasks      タスク名のリスト（選べる名前は doctor.py で見られる）
name: smoke
trials: 1
max_steps: 10
tasks:
  - cube_stack
  - nut_assembly
  - libero_object_3
  - libero_10_0
